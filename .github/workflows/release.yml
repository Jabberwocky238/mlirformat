name: release

# Push a version tag (`0.1.0`) whose number matches Cargo.toml: tests, publishes
# mlirformat-macros then mlirformat to crates.io, and creates the GitHub release.
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token).
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches the crate versions
        run: |
          for m in Cargo.toml macros/Cargo.toml; do
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' "$m" | head -1)
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "$m is $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - run: cargo test --release -p mlirformat
      - run: cargo test -p mlirformat-sampleplugin
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p mlirformat-macros
          cargo publish -p mlirformat
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
