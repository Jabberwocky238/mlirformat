name: release

# Manual only (Actions ⇒ release ⇒ Run workflow, or `gh workflow run release -f version=0.2.1`),
# with `version` equal to the crate version: checks the versions, tests, publishes
# mlirformat-macros then mlirformat to crates.io, creates the GitHub release (tag `version` on the
# chosen commit) and attaches the `mlirformat` command line built for Linux, macOS and Windows.
# Needs the repository secret CARGO_REGISTRY_TOKEN (a crates.io API token).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal the crate version (e.g. 0.2.1).
        required: true
        type: string

env:
  VERSION: ${{ inputs.version }}

permissions:
  contents: write

jobs:
  versions:
    uses: ./.github/workflows/versions.yml
    with:
      tag: ${{ inputs.version }}

  publish:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p mlirformat
      - run: cargo test --manifest-path sampleplugin/Cargo.toml
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p mlirformat-macros
          cargo publish -p mlirformat
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes

  binaries:
    needs: publish
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin mlirformat --target ${{ matrix.target }}
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="mlirformat-$VERSION-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "./$dir/mlirformat.exe"
            gh release upload "$VERSION" "$name.zip"
          else
            tar -czf "$name.tar.gz" -C "$dir" mlirformat
            gh release upload "$VERSION" "$name.tar.gz"
          fi
