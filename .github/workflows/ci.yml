name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    uses: ./.github/workflows/versions.yml

  test:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --release -p mlirformat
      - run: cargo test --manifest-path sampleplugin/Cargo.toml
      - run: cargo build -p mlirformat --no-default-features
      - name: Generated dialects compile in a no_std crate
        run: cargo build --manifest-path tests/nostd/Cargo.toml
