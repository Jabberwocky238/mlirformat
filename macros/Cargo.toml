[package]
name = "mlirformat-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros for mlirformat: #[mlir::op], #[mlir::dialect]"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jabberwocky238/mlirformat.rs"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
