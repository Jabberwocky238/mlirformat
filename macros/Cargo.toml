[package]
name = "mlirformat-macros"
version = "0.4.8"
edition = "2024"
description = "Proc macros for mlirformat: #[mlir::op], #[mlir::dialect], #[derive(mlir::Cases)]"
license = "MIT"
repository = "https://github.com/Jabberwocky238/mlirformat"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
