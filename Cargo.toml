[package]
name = "mlirformat"
version = "0.1.0"
edition = "2024"
description = "Dialect-agnostic MLIR textual format parser/printer with serde support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jabberwocky238/mlirformat.rs"

[workspace]
members = ["macros", "sampleplugin"]

[dependencies]
mlirformat-macros = { path = "macros" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }

[features]
default = ["std"]
std = ["serde/std", "thiserror/std"]

[dev-dependencies]
serde_json = "1"
