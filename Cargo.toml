[package]
name = "mlirformat"
version = "0.2.0"
edition = "2024"
description = "MLIR text <-> IR <-> typed Rust ops: parser, printer, serde-based #[mlir::op] and dialect plugins"
license = "MIT"
repository = "https://github.com/Jabberwocky238/mlirformat.rs"
readme = "README.md"
keywords = ["mlir", "parser", "serde", "compiler", "ir"]
categories = ["parser-implementations", "compilers", "no-std"]
# The mlir-opt fixtures stay in the repository.
exclude = ["tests", "examples", ".github"]

[workspace]
members = ["macros"]
# An out-of-tree dialect: its own crate, depending on mlirformat by path.
exclude = ["sampleplugin"]

[dependencies]
mlirformat-macros = { path = "macros", version = "0.2.0" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["std", "tblgen"]
std = ["serde/std", "thiserror/std"]
# The `mlirformat` command line (`cargo install mlirformat`); `mlirformat tblgen` turns an ODS `.td`
# file into `<dialect>.gen.rs` (it runs `llvm-tblgen`). Off ⇒ the library alone, `no_std` capable.
tblgen = ["std", "dep:clap", "dep:serde_json"]

[[bin]]
name = "mlirformat"
path = "src/cli/main.rs"
required-features = ["tblgen"]

[dev-dependencies]
serde_json = "1"
