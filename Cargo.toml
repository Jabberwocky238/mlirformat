[package]
name = "mlirformat"
version = "0.2.2"
edition = "2024"
description = "MLIR text <-> IR <-> typed Rust ops: parser, printer, serde-based #[mlir::op] and dialect plugins"
license = "MIT"
repository = "https://github.com/Jabberwocky238/mlirformat.rs"
readme = "README.md"
keywords = ["mlir", "parser", "serde", "compiler", "ir"]
categories = ["parser-implementations", "compilers", "no-std"]
# The mlir-opt fixtures stay in the repository.
exclude = ["tests", "examples", ".github"]

[workspace]
members = ["macros"]
# An out-of-tree dialect: its own crate, depending on mlirformat by path.
exclude = ["sampleplugin", "tests/nostd"]

[dependencies]
mlirformat-macros = { path = "macros", version = "0.2.2" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2", default-features = false }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["std", "tblgen"]
std = ["serde/std", "thiserror/std"]
# The `mlirformat` command line (`cargo install mlirformat`); `mlirformat tblgen` turns an ODS `.td`
# file into `<dialect>.gen.rs` (TableGen built in, no LLVM needed). Off ⇒ the library alone, `no_std` capable.
tblgen = ["std", "dep:clap", "dep:serde_json"]
# Test only: the dialects generated by `mlirformat tblgen` (tests/generated/, one test crate each).
gen-tests = []

[[bin]]
name = "mlirformat"
path = "src/cli/main.rs"
required-features = ["tblgen"]

[dev-dependencies]
serde_json = "1"

# Generated dialects, one test crate each so they build in parallel (`--features gen-tests`).
[[test]]
name = "gen_affine"
path = "tests/generated/affine.rs"
required-features = ["gen-tests"]

[[test]]
name = "gen_arith"
path = "tests/generated/arith.rs"
required-features = ["gen-tests"]

[[test]]
